version: '3.8'

services:
  ai-ops-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/aiops
      - SPRING_DATASOURCE_USERNAME=aiops
      - SPRING_DATASOURCE_PASSWORD=aiops
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aiops-network

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=aiops
      - POSTGRES_USER=aiops
      - POSTGRES_PASSWORD=aiops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aiops-network

volumes:
  postgres_data:

networks:
  aiops-network:
    driver: bridge
